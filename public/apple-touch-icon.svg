<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="180" height="180">
  <defs>
    <linearGradient id="a4u-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="a4u-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="a4u-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="a4u-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#a4u-bg)" />
  <rect width="120" height="120" rx="26" fill="url(#a4u-glow)" />
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="#f59e0b" stroke-opacity="0.24" stroke-width="1.5" />

  <g transform="translate(10, 10)">
    <!-- Bold Geometric "4" + Structural Blueprint Vertex Pins -->
    <path d="M 39,19.5 L 39,68.5" fill="none" stroke="url(#a4u-primary)" stroke-width="10.5" stroke-linecap="round" />
    <path d="M 39,19.5 L 14,50 L 49,50" fill="none" stroke="url(#a4u-primary)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="14" cy="50" r="2.4" fill="#ffffff" />
    <circle cx="39" cy="50" r="2.7" fill="#fbbf24" stroke="#ffffff" stroke-width="0.9" />

    <!-- Bold Geometric "U" + Inner Blueprint Structure Diamond -->
    <path d="M 57,30.5 L 57,54.5 C 57,63.2 63,69 71,69 C 79,69 85,63.2 85,54.5 L 85,30.5" fill="none" stroke="url(#a4u-accent)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="71" y1="34.5" x2="71" y2="49.5" stroke="url(#a4u-primary)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.2 2.4" />
    <path d="M 71,38 L 75,42 L 71,46 L 67,42 Z" fill="url(#a4u-primary)" stroke="#ffffff" stroke-width="0.9" stroke-linejoin="round" />

    <!-- Academic Cap & Tassel -->
    <path d="M 48,4.5 L 66,11.5 L 48,18.5 L 30,11.5 Z" fill="url(#a4u-accent)" stroke="#ffffff" stroke-width="1" stroke-linejoin="round" />
    <path d="M 40,14.5 L 40,17.8 C 40,20.2 43,21.2 48,21.2 C 53,21.2 56,20.2 56,17.8 L 56,14.5 Z" fill="url(#a4u-accent)" opacity="0.92" />
    <path d="M 48,11.5 L 66,11.5 L 66,20" fill="none" stroke="url(#a4u-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="66" cy="21.2" r="2" fill="#f59e0b" />

    <!-- EOT Architectural Pedestal -->
    <line x1="13" y1="86.8" x2="25" y2="86.8" stroke="url(#a4u-primary)" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="13" cy="86.8" r="2.7" fill="url(#a4u-primary)" />
    <line x1="75" y1="86.8" x2="87" y2="86.8" stroke="url(#a4u-accent)" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="87" cy="86.8" r="2.7" fill="url(#a4u-accent)" />

    <rect x="25" y="78.3" width="50" height="17" rx="8.5" fill="#1e293b" stroke="url(#a4u-accent)" stroke-width="1.6" />
    <path d="M 39.5,82.8 L 34,82.8 L 34,90.8 L 39.5,90.8 M 34,86.8 L 38.2,86.8" fill="none" stroke="#fbbf24" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="46" y="82.8" width="7" height="8" rx="3.5" fill="none" stroke="#ffffff" stroke-width="2.1" />
    <path d="M 59,82.8 L 66,82.8 M 62.5,82.8 L 62.5,90.8" fill="none" stroke="#fbbf24" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
